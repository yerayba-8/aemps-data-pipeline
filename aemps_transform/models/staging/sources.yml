version: 2

sources:
  - name: aemps_raw_source  # El identificador interno de la fuente
    database: aemps_warehouse
    schema: public
    tables:
      - name: raw_medicamentos  # Carga antigua (julio): listado de CIMA, campo vtm
        description: "Carga antigua (julio) del listado de CIMA. Contiene solo el campo vtm, insuficiente para contar principios activos reales. Se conserva para comparar, no se usa en los modelos de staging vigentes."
      - name: raw_medicamentos_detalle  # Detalle por medicamento, con principiosActivos completo
        description: "Detalle de cada medicamento desde el endpoint /medicamento de CIMA, con el array principiosActivos completo. Clave natural: nregistro. Fuente vigente de los modelos de staging."