services:
  postgres_dwh:
    image: postgres:15-alpine
    container_name: aemps_postgres_dwh
    restart: always
    environment:
      POSTGRES_USER: yeray_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aemps_warehouse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeray_admin -d aemps_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_airflow:
    image: postgres:15-alpine
    container_name: aemps_postgres_airflow
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build: .
    image: aemps-airflow:2.10.2
    container_name: aemps_airflow
    restart: always
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./aemps_transform:/opt/airflow/aemps_transform
      - ./extract.py:/opt/airflow/extract.py
      - ./load.py:/opt/airflow/load.py
      - ./load_catalogo.py:/opt/airflow/load_catalogo.py
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ~/.dbt:/opt/airflow/.dbt   # perfiles de dbt de tu Mac
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres_airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - DBT_PROFILES_DIR=/opt/airflow/.dbt
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_dwh
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      postgres_dwh:
        condition: service_healthy
      postgres_airflow:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: aemps_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres_dwh

volumes:
  postgres_data:
  airflow_pgdata: